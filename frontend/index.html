<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Suburban Insight</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header>
    <span class="logo">Suburban Insight</span>
    <div class="suburb-search" id="suburb-search-wrap">
      <input
        type="text"
        id="suburb-search"
        class="suburb-search-input"
        placeholder="Search suburbs…"
        autocomplete="off"
        role="combobox"
        aria-expanded="false"
        aria-controls="suburb-search-results"
        aria-autocomplete="list"
      />
      <ul id="suburb-search-results" class="suburb-search-results hidden" role="listbox"></ul>
    </div>
    <a id="compare-link" href="compare.html" class="compare-link">Compare suburbs (<span id="compare-count">0</span>)</a>
  </header>

  <div id="filter-bar" class="filter-bar hidden"></div>

  <main class="app-layout">
    <div class="map-pane">
      <div id="map"></div>
      <button id="back-to-councils" class="back-to-councils-btn hidden">&larr; Back to all councils</button>
      <div id="map-legend" class="map-legend"></div>
      <span id="map-status" class="status pending map-status-badge hidden"></span>
    </div>
    <aside id="sidebar" class="sidebar-pane"></aside>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/state.js"></script>
  <script src="js/compare-state.js"></script>
  <script src="js/format.js"></script>
  <script src="js/color-scale.js"></script>
  <script src="js/map.js"></script>
  <script src="js/filters.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/search.js"></script>
  <script>
    document.getElementById("compare-count").textContent = CompareState.getIds().length;
  </script>
</body>
</html>
