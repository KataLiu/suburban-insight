<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Suburban Insight</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header>
    <button id="logo-home-btn" class="logo" aria-label="Suburban Insight — back to full map">Suburban Insight</button>
    <div class="suburb-search" id="suburb-search-wrap" role="search">
      <label for="suburb-search" class="visually-hidden">Search suburbs</label>
      <input
        type="text"
        id="suburb-search"
        class="suburb-search-input"
        placeholder="Search suburbs…"
        autocomplete="off"
        role="combobox"
        aria-expanded="false"
        aria-controls="suburb-search-results"
        aria-autocomplete="list"
      />
      <ul id="suburb-search-results" class="suburb-search-results hidden" role="listbox" aria-label="Suburb suggestions"></ul>
      <span id="suburb-search-status" class="visually-hidden" role="status" aria-live="polite"></span>
    </div>
    <a id="compare-link" href="compare.html" class="compare-link">Compare suburbs (<span id="compare-count">0</span>)</a>
  </header>

  <div id="filter-bar" class="filter-bar hidden" role="region" aria-label="Filter suburbs"></div>

  <main class="app-layout">
    <h1 class="visually-hidden">Melbourne suburb map</h1>
    <div class="map-pane">
      <div id="map"></div>
      <button id="back-to-councils" class="back-to-councils-btn hidden">&larr; Back to all councils</button>
      <div id="map-legend" class="map-legend"></div>
      <span id="map-status" class="status pending map-status-badge hidden" role="status" aria-live="polite"></span>
      <p id="map-hint" class="map-hint">Click a council to explore its suburbs.</p>
      <div id="sidebar-panel" class="sidebar-panel">
        <button id="panel-close" class="panel-close-btn" aria-label="Close">&times;</button>
        <aside id="sidebar" class="sidebar-pane"></aside>
      </div>
    </div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/state.js"></script>
  <script src="js/compare-state.js"></script>
  <script src="js/format.js"></script>
  <script src="js/color-scale.js"></script>
  <script src="js/map.js"></script>
  <script src="js/filters.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/panel.js"></script>
  <script src="js/suburb-combobox.js"></script>
  <script src="js/search.js"></script>
  <script>
    document.getElementById("compare-count").textContent = CompareState.getIds().length;
  </script>
</body>
</html>
